services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psk_db
      POSTGRES_USER: psk_user
      POSTGRES_PASSWORD: psk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - psk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psk_user -d psk_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/psk_db
      SPRING_DATASOURCE_USERNAME: psk_user
      SPRING_DATASOURCE_PASSWORD: psk_dev_password
      APP_SECURITY_JWT_SECRET: PSK-2026-tiekejai-development-secret-key-NEEDS-CHANGE-IN-PRODUCTION-min-256-bits
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        BACKEND_URL: http://localhost:8080
    ports:
      - "4000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  psk_postgres_data:
